name: Godot Export & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  # --- JOB 1: Prepares Godot engine and export templates once ---
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-templates.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

      - name: Download Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d "$HOME/godot"

      - name: Download export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" -O templates.tpz
          mkdir extracted
          unzip -q templates.tpz -d extracted
          mkdir -p "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          cp extracted/templates/* "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/"

      - name: Upload Godot Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-binaries
          path: |
            $HOME/godot/
            $HOME/.local/share/godot/export_templates/

      # --- JOB 2: Export Linux Build independently ---
      - name: Run Linux Export
        run: |
          mkdir -p build/linux
          GODOT_BIN="$HOME/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64"

          # Run export and allow cleanup errors, but capture exit status if it's a real crash
          xvfb-run -a "$GODOT_BIN" --headless --verbose --export-release "Linux" "build/linux/Artificial-Fighter-Linux.x86_64" || true

          # Verify the binary actually exists before proceeding
          if [ ! -f "build/linux/Artificial-Fighter-Linux.x86_64" ]; then
            echo "Error: Linux export binary was not created!"
            exit 1
          fi

          cd build/linux && zip -r ../../Artificial-Fighter-Linux.zip . && cd ../..

      - name: Run Windows Export
        run: |
          mkdir -p build/windows
          GODOT_BIN="$HOME/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64"

          # Run export and allow cleanup errors
          xvfb-run -a "$GODOT_BIN" --headless --verbose --export-release "Windows Desktop" "build/windows/Artificial-Fighter-Windows.exe" || true

          # Verify the binary actually exists before proceeding
          if [ ! -f "build/windows/Artificial-Fighter-Windows.exe" ]; then
            echo "Error: Windows export binary was not created!"
            exit 1
          fi

          cd build/windows && zip -r ../../Artificial-Fighter-Windows.zip . && cd ../..

  # --- JOB 4: Combine and Publish Release ---
  release:
    needs: [export-linux, export-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Artificial Fighter ${{ github.ref_name }}"
          body_path: RELEASE.md
          generate_release_notes: true
          files: dist/**/*.zip
          overwrite_files: true
