name: Godot Export & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb zip

      - name: Download Godot
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip -d "$HOME/godot"

      - name: Download export templates
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O templates.tpz

          mkdir extracted
          unzip -q templates.tpz -d extracted

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          cp extracted/templates/* \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export & Package Builds
        run: |
          set -e

          GODOT_BIN="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          # 1. Create temporary folders for each platform build
          mkdir -p build/linux build/windows
          mkdir -p dist

          echo "=== Exporting Linux ==="
          xvfb-run -a "$GODOT_BIN" \
            --headless \
            --verbose \
            --export-release "Linux" \
            "build/linux/Artificial-Fighter-Linux.x86_64"

          echo "=== Exporting Windows ==="
          xvfb-run -a "$GODOT_BIN" \
            --headless \
            --verbose \
            --export-release "Windows Desktop" \
            "build/windows/Artificial-Fighter-Windows.exe"

          echo "=== Zipping Release Packages ==="
          # Zip the contents of the build/linux folder into a single archive
          cd build/linux && zip -r ../../dist/Artificial-Fighter-Linux.zip . && cd ../..
          # Zip the contents of the build/windows folder into a single archive
          cd build/windows && zip -r ../../dist/Artificial-Fighter-Windows.zip . && cd ../..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artificial-Fighter-${{ github.ref_name }}
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Artificial Fighter ${{ github.ref_name }}"
          body_path: RELEASE.md
          generate_release_notes: true
          files: dist/*.zip
          overwrite_files: true
