name: Godot Export (Linux)

on:
  push:
    branches:
      - gameplay

jobs:
  export-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        env:
          GODOT_VERSION: "4.7"
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -O godot.zip || true
          if [ ! -s godot.zip ]; then
            echo "Falha ao baixar Godot. Ajuste URL/arquivo para sua versão/pacote."
            exit 1
          fi
          unzip -q godot.zip -d $HOME/godot
          echo "$HOME/godot/Godot_v4.7-stable_linux_x86_64" >> $GITHUB_PATH

      - name: Debug godot folder
        run: |
          echo "Godot extracted folders:"
          find "$HOME/godot" -maxdepth 3 -type f -iname "*godot*" -o -type f -maxdepth 3
          ls -R "$HOME/godot" | head -n 200

      - name: Download Godot export templates
        env:
          GODOT_VERSION: "4.7"
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates"

          # Templates pack for 4.7 stable (Linux)
          # If this URL changes, paste the Godot 4.7 stable templates link you see and I’ll adjust.
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz || true

          if [ ! -s templates.tpz ]; then
            echo "Could not download export templates tpz. Fix the URL/filename."
            exit 1
          fi

          # Extract tpz
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates"

          echo "Templates installed."
      
      - name: Show template layout
        run: |
          find "$HOME/.local/share/godot/export_templates", -maxdepth 3, -type find

      - name: Export project (Linux)
        env:
          EXPORT_PRESET: "Linux"
        run: |
          set -e
          GODOT_BIN="$(find "$HOME/godot/Godot_v4.7-stable_linux.x86_64" -type f -maxdepth 2 -iname "Godot*" | head -n 1)"
          mkdir -p out
          xvfb-run -a "$GODOT_BIN" --headless --export-release "$EXPORT_PRESET" "out/game_linux.x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-${{ github.sha }}
          path: out/game_linux.x86_64.zip
          if-no-files-found: error
