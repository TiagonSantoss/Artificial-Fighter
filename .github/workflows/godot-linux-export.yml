name: Godot Export (Linux)

on:
  push:
    branches:
      - gameplay   # <- troque pelo nome da branch

jobs:
  export-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        env:
          GODOT_VERSION: "4.7"
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux_x86_64.zip -O godot.zip || true
          if [ ! -s godot.zip ]; then
            echo "Falha ao baixar Godot. Ajuste URL/arquivo para sua versão/pacote."
            exit 1
          fi
          unzip -q godot.zip -d $HOME/godot
          echo "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux_x86_64" >> $GITHUB_PATH

      - name: Export project for Linux
        env:
          EXPORT_PRESET: "Linux" 
        run: |
          GODOT_BIN="$(ls -d $HOME/godot/Godot_v${GODOT_VERSION}-stable_linux_x86_64/* 2>/dev/null | head -n 1)"
          # fallback: tenta usar bin direto
          GODOT_BIN="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux_x86_64/Godot_v${GODOT_VERSION}-stable_linux_x86_64"
          mkdir -p out
          xvfb-run -a "$GODOT_BIN" --headless --export-release "$EXPORT_PRESET" "out/game_linux.x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-${{ github.sha }}
          path: out/game_linux.x86_64.zip
          if-no-files-found: error

